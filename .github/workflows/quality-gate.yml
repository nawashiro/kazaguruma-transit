name: Quality Gate

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Prepare public app configuration
        run: |
          cp app-config.json.example app-config.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run strict TypeScript check
        run: npx tsc --noEmit --incremental false

      - name: Place synthetic transit configuration
        run: cp "ci/transit-config.json" "transit-config.json"
      - name: Build production app
        run: npm run build

      - name: Run Jest unit suites
        run: npm run test:unit:ci

      - name: Run Jest production-server suites
        run: npm run test:server:ci

      - name: Remove synthetic transit configuration
        if: always()
        working-directory: .
        run: rm -f -- "transit-config.json"
