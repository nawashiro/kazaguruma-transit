name: Quality Gate

on:
  push:
    branches:
      - dev
      - master
  pull_request:
    branches:
      - dev
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Prepare public app configuration
        run: |
          cp app-config.json.example app-config.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run strict TypeScript check
        run: npx tsc --noEmit --incremental false

      - name: Place synthetic transit configuration
        run: cp "ci/transit-config.json" "transit-config.json"
      - name: Build production app
        run: npm run build

      - name: Start production server
        run: |
          node node_modules/next/dist/bin/next start -p 3100 > "$RUNNER_TEMP/next-start.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/next-server.pid"
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3100/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/next-start.log"
          exit 1

      - name: Run Jest
        run: npm test -- --runInBand --ci

      - name: Stop production server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/next-server.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/next-server.pid")" 2>/dev/null || true
          fi

      - name: Remove synthetic transit configuration
        if: always()
        working-directory: .
        run: rm -f -- "transit-config.json"
