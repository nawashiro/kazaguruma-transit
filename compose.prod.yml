services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
      secrets:
        - transit_config
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    command: ["npm", "run", "start"]
    secrets:
      - source: transit_config
        target: /app/transit-config.json
    networks:
      - app-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  temp-data:
    driver: local

secrets:
  transit_config:
    file: ./transit-config.json
